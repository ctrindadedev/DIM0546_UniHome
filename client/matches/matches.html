<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achar Colegas - UniHome</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/global.css" />
    <link rel="stylesheet" href="matches.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a href="../home/home.html" class="logo"
          ><span class="logo-mark">U</span> UniHome</a
        >
        <nav class="sidebar-nav">
          <a href="../dashboard/dashboard.html"
            ><span class="icon">🏠</span> Início</a
          >
          <a href="../imoveis/imoveis.html"
            ><span class="icon">🏢</span> Buscar Imóveis</a
          >
          <a href="../anunciar/anunciar.html"
            ><span class="icon">➕</span> Anunciar Imóvel</a
          >
          <a href="matches.html" class="active"
            ><span class="icon">🤝</span> Achar Colegas</a
          >
          <a href="#"><span class="icon">💬</span> Meus Grupos</a>
          <a href="../perfil/perfil.html"
            ><span class="icon">⚙️</span> Meu Perfil</a
          >
        </nav>
      </aside>

      <main class="app-main">
        <header class="app-header">
          <button class="menu-toggle" data-menu-toggle aria-label="Menu">
            ☰
          </button>
          <div class="search-bar">
            <span>🔍</span>
            <input
              id="match-search"
              type="search"
              placeholder="Buscar por nome ou curso..."
            />
          </div>
          <div class="avatar-wrap">
            <img
              src="https://i.pravatar.cc/100?img=12"
              class="avatar"
              data-avatar-toggle
              alt="Avatar"
            />
            <div class="dropdown" id="user-dropdown">
              <a href="../perfil/perfil.html">Meu Perfil</a>
              <a href="#">Configurações</a>
              <hr />
              <a href="../home/home.html">Sair</a>
            </div>
          </div>
        </header>

        <div class="app-content">
          <div class="page-head">
            <h1>Encontre seus colegas ideais</h1>
            <p>Perfis ordenados por compatibilidade com seus hábitos.</p>
          </div>
          <div class="layout-with-sidebar">
            <aside class="filters">
              <h3>Filtros</h3>
              <div class="filter-group">
                <label for="study-routine">Rotina de estudos</label>
                <select id="study-routine">
                  <option value="">Todas</option>
                  <option value="matutina">Matutina</option>
                  <option value="vespertina">Vespertina</option>
                  <option value="noturna">Noturna</option>
                  <option value="flexivel">Flexível</option>
                </select>
              </div>
              <div class="filter-group">
                <label for="accepts-pets">Aceita animais</label>
                <select id="accepts-pets">
                  <option value="">Não importa</option>
                  <option value="true">Sim</option>
                  <option value="false">Não</option>
                </select>
              </div>
              <div class="filter-group">
                <label for="min-compatibility">
                  Compatibilidade mínima:
                  <output id="compatibility-value">0%</output>
                </label>
                <input
                  id="min-compatibility"
                  type="range"
                  min="0"
                  max="100"
                  value="0"
                  class="slider"
                />
              </div>
              <button class="btn btn-primary btn-block" data-filter-apply>
                Aplicar Filtros
              </button>
            </aside>
            <div class="grid grid-3" id="matches" aria-live="polite"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="../shared/main.js"></script>
    <script type="module" src="matches.js"></script>
  </body>
</html>
